{% extends "base.html" %}
{% block title %}Upload photos{% endblock %}
{% block content %}
<h1>Upload photos</h1>
<form method="post" action="{{ url_for('main.upload_photos') }}" enctype="multipart/form-data">
  <p>
    <label for="box">Which box?</label><br>
    <select id="box" name="box">
      <option value="new">New box</option>
      {% for box in boxes %}
      <option value="{{ box.id }}">{{ box.name }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label for="new_box_name">Name for a new box</label><br>
    <input id="new_box_name" name="new_box_name" type="text" maxlength="60">
  </p>
  <p>
    <label for="photos">Photos (JPEG or PNG)</label><br>
    <input id="photos" name="photos" type="file" accept="image/jpeg,image/png" multiple>
  </p>
  <p><button type="submit">Upload</button></p>
</form>
{% endblock %}
